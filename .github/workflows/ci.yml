name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile
        run: python -m py_compile src/topic_digest/*.py tests/*.py
      - name: Validate example configs
        run: |
          topic-digest --config examples/ai.yaml validate
          topic-digest --config examples/geopolitics.yaml validate
          topic-digest --config examples/science-discoveries.yaml validate
      - name: Smoke test CLI prompts
        run: |
          topic-digest --config examples/ai.yaml --candidates /tmp/ai.jsonl hermes-prompts >/tmp/ai-prompts.md
          topic-digest --config examples/geopolitics.yaml --candidates /tmp/geo.jsonl hermes-prompts >/tmp/geo-prompts.md
          topic-digest --config examples/science-discoveries.yaml --candidates /tmp/science.jsonl hermes-prompts >/tmp/science-prompts.md
