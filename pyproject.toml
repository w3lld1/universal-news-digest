[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "universal-news-digest"
version = "0.1.0"
description = "Config-driven news digest collector and renderer for any topic"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "w3lld1"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["news", "digest", "rss", "automation", "llm", "cron"]

[project.scripts]
topic-digest = "topic_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/topic_digest"]
